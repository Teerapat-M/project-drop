  <path d="M168 128 L226 128 C232 128 236 132 236 138 L232 152 L170 152 C166 152 164 148 164 144 L164 130 C164 128 166 128 168 128 Z" fill="url(#pnBed)"/>
  <!-- bed rail highlight -->
  <path d="M168 128 L226 128 C230 128 234 130 234 134 L168 134 Z" fill="#C5D6EC" opacity="0.35"/>
  <!-- front bumper -->
  <path d="M42 156 C36 152 36 164 44 172 L62 176 L56 160 C54 154 48 152 42 156 Z" fill="url(#pnBumper)"/>
  <!-- rear bumper / tailgate lip -->
  <path d="M230 166 C238 164 244 168 242 176 C240 182 232 182 224 180 L230 166 Z" fill="url(#pnBumper)"/>
