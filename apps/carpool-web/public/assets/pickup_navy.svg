<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="pnBody" x1="0.12" y1="0.05" x2="0.85" y2="1">
      <stop offset="0" stop-color="#8AA4C8"/>
      <stop offset="0.4" stop-color="#3A5A8A"/>
      <stop offset="1" stop-color="#1E3358"/>
    </linearGradient>
    <linearGradient id="pnGlass" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#E4F6FF"/>
      <stop offset="0.35" stop-color="#8ED0F2"/>
      <stop offset="1" stop-color="#3A88C4"/>
    </linearGradient>
    <linearGradient id="pnUnder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A392A8"/>
      <stop offset="1" stop-color="#6E5E74"/>
    </linearGradient>
    <linearGradient id="pnLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF6C4"/>
      <stop offset="0.55" stop-color="#F2C94C"/>
      <stop offset="1" stop-color="#E0A020"/>
    </linearGradient>
    <linearGradient id="pnBed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A3C48"/>
      <stop offset="1" stop-color="#2A222C"/>
    </linearGradient>
    <radialGradient id="pnTire" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#5A5160"/>
      <stop offset="0.55" stop-color="#2B2432"/>
      <stop offset="1" stop-color="#161218"/>
    </radialGradient>
    <radialGradient id="pnHub" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#F0E6EE"/>
      <stop offset="1" stop-color="#B79AAC"/>
    </radialGradient>
    <linearGradient id="pnBumper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D8D0D6"/>
      <stop offset="1" stop-color="#8E8490"/>
    </linearGradient>
  </defs>
  <ellipse cx="128" cy="226" rx="96" ry="11" fill="#1A1220" opacity="0.16"/>
  <ellipse cx="192" cy="188" rx="30" ry="31" fill="url(#pnTire)"/>
  <ellipse cx="192" cy="188" rx="14" ry="14.5" fill="url(#pnHub)"/>
  <ellipse cx="188" cy="184" rx="5" ry="5" fill="#FFFFFF" opacity="0.35"/>
  <ellipse cx="74" cy="188" rx="30" ry="31" fill="url(#pnTire)"/>
  <ellipse cx="74" cy="188" rx="14" ry="14.5" fill="url(#pnHub)"/>
  <ellipse cx="70" cy="184" rx="5" ry="5" fill="#FFFFFF" opacity="0.35"/>
  <path d="M44 176 C42 184 48 190 60 192 L210 192 C224 191 232 184 230 176 Z" fill="url(#pnUnder)"/>
  <!-- cab -->
  <path d="M44 162
