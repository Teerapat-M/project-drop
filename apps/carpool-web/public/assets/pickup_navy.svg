  <ellipse cx="49" cy="142" rx="4" ry="5" fill="#FFFFFF" opacity="0.7"/>
  <!-- cab rear window / small taut -->
  <path d="M148 106 L156 110 L156 126 L148 126 Z" fill="#3A88C4" opacity="0.35"/>
  <!-- hood highlight -->
  <ellipse cx="82" cy="126" rx="18" ry="7" fill="#FFFFFF" opacity="0.28" transform="rotate(-16 82 126)"/>
  <!-- cab roof highlight -->
  <ellipse cx="128" cy="92" rx="20" ry="6" fill="#FFFFFF" opacity="0.22"/>
