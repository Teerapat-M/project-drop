<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="hBody" x1="0.12" y1="0.05" x2="0.85" y2="1">
      <stop offset="0" stop-color="#C8F3DE"/>
      <stop offset="0.4" stop-color="#5FCBB0"/>
      <stop offset="1" stop-color="#2E8F7A"/>
    </linearGradient>
    <linearGradient id="hGlass" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#E4F6FF"/>
      <stop offset="0.35" stop-color="#8ED0F2"/>
      <stop offset="1" stop-color="#3A88C4"/>
    </linearGradient>
    <linearGradient id="hUnder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A392A8"/>
      <stop offset="1" stop-color="#6E5E74"/>
    </linearGradient>
    <linearGradient id="hLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF6C4"/>
      <stop offset="0.55" stop-color="#F2C94C"/>
      <stop offset="1" stop-color="#E0A020"/>
    </linearGradient>
    <radialGradient id="hTire" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#5A5160"/>
      <stop offset="0.55" stop-color="#2B2432"/>
      <stop offset="1" stop-color="#161218"/>
    </radialGradient>
    <radialGradient id="hHub" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#F0E6EE"/>
      <stop offset="1" stop-color="#B79AAC"/>
    </radialGradient>
    <linearGradient id="hBumper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D8D0D6"/>
      <stop offset="1" stop-color="#8E8490"/>
